version: '3.8'

services:
  app:
    image: marley2022/ihome-agents:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./research_stocks:/app/research_stocks
      - ./output:/app/output
    working_dir: /app/research_stocks/src
    command: ["python3", "main.py"]
    restart: unless-stopped
